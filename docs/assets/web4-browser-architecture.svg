<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Web4 Browser prototype architecture</title>
  <desc id="desc">A static browser workspace with navigation UI, local profile context, sandboxed web content, demo marketplace, and validation workflows. Backend identity, wallet signing, real-time chat, and blockchain settlement are not implemented.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d19"/><stop offset="1" stop-color="#17102c"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#20d5e8"/><stop offset="1" stop-color="#b56cff"/></linearGradient>
    <style>
      .h{font:700 27px system-ui,sans-serif;fill:#f5f7ff}.sub{font:400 14px system-ui,sans-serif;fill:#aeb9ce}.label{font:700 17px system-ui,sans-serif;fill:#f6f7ff}.body{font:400 13px system-ui,sans-serif;fill:#c3cce0}.tiny{font:600 11px system-ui,sans-serif;fill:#8fa1bd;letter-spacing:1.2px}.card{fill:#111a2b;stroke:#35415b;stroke-width:1.5}.line{stroke:url(#accent);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.tag{fill:#1a3041;stroke:#285b70}.tagtext{font:600 11px system-ui,sans-serif;fill:#7be7f0}.warn{fill:#33261a;stroke:#80633b}.warntext{font:600 12px system-ui,sans-serif;fill:#ffd28a}
    </style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <path d="M40 86H1160" stroke="#28334b"/>
  <text x="48" y="48" class="tiny">WEB4 / SYSTEM MAP</text>
  <text x="48" y="76" class="h">Browser workspace · current prototype boundary</text>
  <text x="48" y="111" class="sub">Static front-end surfaces, local demo state, and CI validation — not yet a connected identity or transaction platform.</text>
  <rect x="48" y="145" width="1104" height="86" rx="16" class="card"/>
  <text x="76" y="179" class="tiny">ENTRY / UI</text>
  <text x="76" y="207" class="label">Browser shell · index.html</text>
  <text x="405" y="183" class="body">Tabs · address/search · back/forward · local history</text>
  <text x="405" y="205" class="body">Sandboxed HTTP(S) iframe · local custom-scheme placeholders</text>
  <rect x="920" y="168" width="200" height="35" rx="17" class="tag"/><text x="1020" y="190" text-anchor="middle" class="tagtext">STATIC FRONT END</text>
  <path d="M600 231V267M200 267H1000M200 267V294M600 267V294M1000 267V294" class="line"/>
  <rect x="48" y="294" width="304" height="125" rx="14" class="card"/>
  <text x="72" y="325" class="tiny">SURFACE A</text><text x="72" y="352" class="label">Workspace</text>
  <text x="72" y="378" class="body">Profile UI · AI/page drafts · chat</text><text x="72" y="398" class="body">radio · podcast · automation samples</text>
  <rect x="448" y="294" width="304" height="125" rx="14" class="card"/>
  <text x="472" y="325" class="tiny">SURFACE B</text><text x="472" y="352" class="label">Intent marketplace</text>
  <text x="472" y="378" class="body">Sample prices · profile-scoped balances</text><text x="472" y="398" class="body">In-memory intents · simulated settlement</text>
  <rect x="848" y="294" width="304" height="125" rx="14" class="card"/>
  <text x="872" y="325" class="tiny">SURFACE C</text><text x="872" y="352" class="label">Token / fiat gateway</text>
  <text x="872" y="378" class="body">Prototype interface and sample data</text><text x="872" y="398" class="body">No verified payments or live rates</text>
  <path d="M200 419V449H1000V419M600 449V477" stroke="#6d7792" stroke-width="2" fill="none" stroke-dasharray="6 7"/>
  <rect x="48" y="477" width="704" height="106" rx="14" class="card"/>
  <text x="72" y="508" class="tiny">QUALITY / DELIVERY</text><text x="72" y="535" class="label">GitHub Pages + static validation workflow</text>
  <text x="72" y="559" class="body">HTML required-ID checks · duplicate-ID checks · Node syntax checks</text>
  <rect x="782" y="477" width="370" height="106" rx="14" class="warn"/>
  <text x="806" y="508" class="tiny">NOT IMPLEMENTED</text>
  <text x="806" y="534" class="warntext">Verified login / DID · key custody / signing</text>
  <text x="806" y="555" class="warntext">Realtime chat · production APIs · chain settlement</text>
  <text x="48" y="621" class="sub">Architecture reflects repository files and documented behavior; dashed lines indicate integration work still required.</text>
</svg>